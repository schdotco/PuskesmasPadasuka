<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pengguna - Admin Puskesmas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="admin-navbar">
        <div class="brand">
            <i class="fa-solid fa-shield-halved"></i>
            Admin Panel Puskesmas
        </div>
        <button id="btnLogout" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
    </nav>

    <!-- Content -->
    <div class="container">
        <div class="card">
            <h2 class="card-title">
                <i class="fa-solid fa-user-plus"></i> Tambah Pengguna Baru
            </h2>

            <form id="addUserForm">
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label>Nama Lengkap (Sesuai SK)</label>
                        <input type="text" id="nama" class="form-control" required placeholder="Budi Santoso">
                    </div>

                    <div class="form-group">
                        <label>NIP / NIK</label>
                        <input type="text" id="nip" class="form-control" required placeholder="19800101">
                        <small style="color: #6b7280; font-size: 11px;">Akan dijadikan Email: nip@padasuka.go.id</small>
                    </div>

                    <div class="form-group">
                        <label>Hak Akses (Role)</label>
                        <select id="role" class="form-select" required>
                            <option value="">-- Pilih Hak Akses --</option>
                            <option value="admin">Administrator / Kepala TU</option>
                            <option value="dokter">Dokter Pemeriksa</option>
                            <option value="bidan_desa">Bidan Desa (Laporan Wilayah)</option>
                            <option value="laboratorium">Petugas Laboratorium (Data Lab)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Kata Sandi Sementara</label>
                        <input type="text" id="password" class="form-control" required placeholder="Minimal 6 karakter" minlength="6">
                    </div>

                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    Simpan Pengguna
                </button>
            </form>
        </div>
    </div>

    <!-- Script Logika Admin -->
    <script type="module" src="admin-auth.js"></script>
</body>
</html>
