<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UPTD Puskesmas Padasuka</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 untuk Pop-up -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- PANGGIL FILE CSS DISINI -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Header Section -->
            <div class="header">
                <i class="fa-solid fa-house-medical header-icon"></i>
                <h1>Selamat Datang</h1>
                <p>Sistem Informasi UPTD Puskesmas Padasuka</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                
                <div class="form-group">
                    <label for="username">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user icon-left"></i>
                        <input type="text" id="username" class="form-control" placeholder="Contoh: xxxx@gmail.com" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock icon-left"></i>
                        <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi" required autocomplete="current-password">
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword" title="Tampilkan/Sembunyikan Sandi"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Ingat Saya
                    </label>
                    <a href="#" class="forgot-password">Lupa Sandi?</a>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span id="btnText">Masuk</span> <i class="fa-solid fa-arrow-right-to-bracket" id="btnIcon"></i>
                </button>

            </form>
        </div>
        
        <div class="footer">
            &copy; 2026 UPTD Puskesmas Padasuka.<br>Dinas Kesehatan.
        </div>
    </div>

    <!-- PANGGIL FILE JAVASCRIPT DISINI -->
    <!-- type="module" wajib digunakan karena auth.js melakukan 'import' dari Firebase -->
    <script type="module" src="auth.js"></script>
    
</body>
</html>
